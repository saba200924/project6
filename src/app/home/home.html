<section class="hero">
  <div class="hero-overlay">

    <div class="hero-content">
      <h1>Delicious Food Delivered to Your Door</h1>

      <p>
        Fresh ingredients, authentic flavors, fast delivery
      </p>

      <button class="hero-btn" routerLink="/menu">
        Order Now
      </button>
    </div>

  </div>
</section>


<section class="popular-section">

  <h2 class="popular-title">
    Popular Dishes
  </h2>

</section>

<!-- PRODUCTS -->
<div class="products-container">
  @for (item of productsarr; track item.id) {

    <!-- The whole card navigates to details -->
    <div class="card" [routerLink]="['/details']" [queryParams]="{id: item.id}">
      
      <img [src]="item.image" class="card-img-top" alt="...">

      <div class="card-body">

        <h5 class="card-title">{{item.name}}</h5>

        <p class="card-text">{{item.description}}</p>

        <p class="card-text">⭐ {{item.rate}}</p>

        <p class="card-text">${{item.price}}</p>

        @if(isLoggedIn){

          <button
            class="btn btn-primary"
            (click)="addToCart(item, $event)">
            Add to cart
          </button>

        }

        @else{
            
          <button
            class="btn btn-danger"
            (click)="showLoginAlert($event)">
            Add to cart
          </button>
            
        }

      </div>
    </div>
  }

  <div class="toast" [class.show]="showToast">
    {{toastMessage}}
  </div>
</div>
