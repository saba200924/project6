<div class="products-container">
  @for (item of productsarr; track item.id) {
    <!-- The whole card navigates to details -->
    <div class="card" [routerLink]="['/details']" [queryParams]="{id: item.id}">
      <img [src]="item.image" class="card-img-top" alt="...">

      <div class="card-body">
        <h5 class="card-title">{{item.name}}</h5>
        <p class="card-text">{{item.description}}</p>
        <p class="card-text">⭐ {{item.rate}}</p>
        <p class="card-text">${{item.price}}</p>

        <!-- Use $event.stopPropagation() to prevent navigating to details -->
        <!-- Pass 'item' into the function -->
        <button class="btn btn-primary" (click)="addToCart(item, $event)">
          Add to cart
        </button>
      </div>
    </div>
  }
    <div class="toast" [class.show]="showToast">
  {{toastMessage}}
</div>
</div>
