<section class="hero">
  <div class="hero-overlay">

    <div class="hero-content">
      <h1>Delicious Food Delivered to Your Door</h1>

      <p>
        Fresh ingredients, authentic flavors, fast delivery
      </p>

      <button class="hero-btn" routerLink="/menu">
        Order Now
      </button>
    </div>

  </div>
</section>

<section class="popular-section">
  <h2 class="popular-title">Popular Dishes</h2>
</section>

<!-- PRODUCTS -->
<div class="products-container">

  @for (item of productsarr; track item.id) {

    <!-- CLEAN CARD (NO routerLink HERE) -->
    <div class="card">

      <!-- CLICK ONLY IMAGE -->
      <img
        [src]="item.image"
        class="card-img-top"
        alt="..."
        (click)="goToDetails(item.id)"
        style="cursor: pointer;"
      >

      <div class="card-body">

        <!-- CLICK ONLY TITLE -->
        <h5 class="card-title" (click)="goToDetails(item.id)" style="cursor: pointer;">
          {{item.name}}
        </h5>

        <p class="card-text">{{item.description}}</p>
        <p class="card-text">⭐ {{item.rate}}</p>
        <p class="card-text">${{item.price}}</p>

        <!-- ADD TO CART -->
        @if(isLoggedIn){

          <button
            type="button"
            class="btn btn-primary"
            (click)="addToCart(item, $event)"
          >
            Add to cart
          </button>

        } @else {

          <button
            type="button"
            class="btn btn-danger"
            (click)="showLoginAlert($event)"
          >
            Add to cart
          </button>

        }

      </div>

    </div>

  }

</div>

<!-- TOAST -->
<div class="toast" [class.show]="showToast">
  {{toastMessage}}
</div>
