<div class="category" style="margin-top: 150px;">
  <label (click)="all()" for="all">All</label>
  @for (item of categoriesarr; track item.id) {
    <input 
      type="radio"
      name="category"
      [id]="'cat-' + item.id"
      (change)="filterByCategory(item.id)"
      [checked]="selectedCategoryId === item.id"
    >
    <label 
      [for]="'cat-' + item.id"
      (click)="filterByCategory(item.id)"
    >
      {{item.name}}
    </label>
  }


  <div class="search-filter">
  <input
    type="text"
    placeholder="Search products..."
    [(ngModel)]="searchText"
    (input)="filterBySearch()"
  />
</div>

<!-- 🌱 VEGETARIAN TOGGLE -->
<button
  class="veg-btn"
  (click)="toggleVegetarian()"
  [class.active]="vegetarian"
>
  🌱 Vegetarian
</button>

<div class="spicy-filter">
  <label>🌶️<span class="rate-value">{{ selectedSpicy }}</span></label>

  <input
    type="range"
    min="0"
    max="5"
    step="1"
    [(ngModel)]="selectedSpicy"
    (input)="filterBySpicy()"
  />
</div>

<div class="rate-filter">
  <label>⭐<span class="rate-value">{{ selectedRate }}</span></label>
    

  <input
    type="range"
    min="0"
    max="5"
    step="0.5"
    [(ngModel)]="selectedRate"
    (input)="filterByRate()"
  />
</div>

  <div class="price-filter">
    <label>💰<span class="rate-value">Less than  {{ selectedPrice }}$</span></label>

    <input
      type="range"
      min="0"
      max="50"
      step="2"
      [(ngModel)]="selectedPrice"
      (input)="filterByPrice()"
    />
  </div>

  <!-- 🔄 RESET ALL -->
<button
  class="reset-btn"
  (click)="resetAll()"
>
   Reset All Filter
</button>

</div>


<div class="products-container">
  @for (item of productsarr; track $index) {
    <div class="card" routerLink="/details" [queryParams]="{id: item.id}">
      <img [src]="item.image" class="card-img-top" alt="...">

<div class="card-body">
  <div class="card-info">
    <h5 class="card-title">{{item.name}}</h5>
    <p class="card-text">{{item.description}}</p>
    <p class="card-text">⭐ {{item.rate}}</p>
    <p class="card-text price">${{item.price}}</p>
  </div>

  <div class="card-actions">
    <a href="#" class="btn btn-primary" (click)="addToCart(item, $event)">Add to cart</a>
  </div>
</div>
</div>
  }
      <div class="toast" [class.show]="showToast">
  {{toastMessage}}
</div>
</div>
